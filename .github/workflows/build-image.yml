# 每周（以及 .devcontainer 有改动时）把桌面镜像构建好推到 GHCR。
# 作用：别人 fork 后开 codespace 时，devcontainer.json 里的 cacheFrom 能命中这些层，
#       首次启动从 3~5 分钟缩短到几十秒。
# 成本：公开仓库的 GitHub Actions 分钟免费，GHCR 公开包也免费。
name: Build desktop image

on:
  schedule:
    # 每周一 03:17 UTC
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # 注意：buildx 的 file 是相对「仓库根目录」解析的，不是相对 context
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/codespaces-remote-desktop:latest
          # 关键：必须用 type=inline 把缓存元数据写进镜像，
          # 否则 fork 用户在 Codespaces 里 `docker build --cache-from` 命中不到任何层。
          # cache-from 用 registry 类型，这样本 workflow 每周重跑时也能复用上次结果。
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/codespaces-remote-desktop:latest
          cache-to: type=inline,mode=max

      # 确保包是公开的（否则 fork 用户拉不到缓存层）
      - name: Ensure package is public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            "/user/packages/container/codespaces-remote-desktop/visibility" \
            -f visibility=public || \
          gh api -X PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/codespaces-remote-desktop/visibility" \
            -f visibility=public
